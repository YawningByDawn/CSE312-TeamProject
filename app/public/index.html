<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSE312 Team Project</title>
</head>
<body>
  <p id="status">Not logged in</p>
  <form id="auth-form">
    <input id="username" placeholder="username" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button data-path="/login">Login</button>
    <button data-path="/register">Register</button>
  </form>
  <button id="logout" hidden>Logout</button>
  <canvas id="world" width="800" height="600" style="border: 1px solid #ccc" hidden></canvas>

  <script>
    const statusText = document.getElementById("status");
    const form = document.getElementById("auth-form");
    const logoutButton = document.getElementById("logout");
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const keys = {};
    let socket = null;

    async function post(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = res.headers.get("Content-Type")?.includes("json") ? await res.json() : {};
      return { ok: res.ok, data };
    }

    async function refresh() {
      const res = await fetch("/api/me");
      statusText.textContent = res.ok ? "Logged in as " + (await res.json()).username : "Not logged in";
      form.hidden = res.ok;
      logoutButton.hidden = !res.ok;
      canvas.hidden = !res.ok;
      if (res.ok && !socket) connect();
      if (!res.ok && socket) socket.close();
    }

    function connect() {
      const scheme = location.protocol === "https:" ? "wss://" : "ws://";
      socket = new WebSocket(scheme + location.host + "/ws");
      let kicked = false;
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "kicked") kicked = true;
        if (message.type === "state") draw(message);
      };
      socket.onclose = () => {
        socket = null;
        if (kicked) statusText.textContent = "Opened in another tab";
        else setTimeout(refresh, 1000);
      };
    }

    function draw(message) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of message.players) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillText(p.name, p.x + 12, p.y + 4);
      }
    }

    function sendInput() {
      if (socket?.readyState !== WebSocket.OPEN) return;
      const dx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
      const dy = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
      socket.send(JSON.stringify({ type: "input", dx, dy }));
    }

    document.addEventListener("keydown", (event) => {
      if (!keys[event.key]) {
        keys[event.key] = true;
        sendInput();
      }
    });
    document.addEventListener("keyup", (event) => {
      keys[event.key] = false;
      sendInput();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const path = event.submitter.dataset.path;
      const creds = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      };
      let result = await post(path, creds);
      if (result.ok && path === "/register") result = await post("/login", creds);
      if (!result.ok) {
        statusText.textContent = result.data.error || "Request failed";
        return;
      }
      refresh();
    });

    logoutButton.addEventListener("click", async () => {
      await post("/logout", {});
      refresh();
    });

    refresh();
  </script>
</body>
</html>
