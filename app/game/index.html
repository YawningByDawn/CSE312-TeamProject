<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Hungry God Inc.</title>
    <style>
      /* The stage letterboxes into #app, which fills the root's content box: a host page may pad
         :root with env(safe-area-inset-*) (or embed us in an iframe), and we stay inside it. */
      html { box-sizing: border-box; height: 100%; margin: 0; background: #000; overflow: hidden; }
      body { box-sizing: border-box; margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #game { position: absolute; left: 0; top: 0; display: block; background: #000; touch-action: none; }
      #ui { position: absolute; left: 0; top: 0; pointer-events: none; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <!-- #ui is pointer-events: none (clicks fall through to the canvas); every interactive panel inside it must opt back in with pointer-events: auto. -->
      <div id="ui"></div>
    </div>
    <script type="module" src="/src/app/boot.ts"></script>
  </body>
</html>
