<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hungry God Inc workshop</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0a14; color: #cfc4e6; font: 13px Inter, system-ui, sans-serif; }
      body { display: flex; }
      nav { flex: 0 0 190px; overflow-y: auto; background: #15101f; border-right: 1px solid #2a2140; padding: 8px 0; }
      nav h2 { margin: 10px 14px 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #7d6fa0; }
      nav a { display: block; padding: 5px 14px; color: #cfc4e6; text-decoration: none; }
      nav a:hover { background: #1f1830; }
      nav a.on { background: #2b2146; color: #fff; box-shadow: inset 3px 0 0 #ab80ff; }
      main { flex: 1; min-width: 0; position: relative; }
      iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
      #approvals { position: absolute; inset: 0; overflow-y: auto; padding: 4px 18px 40px; }
      [hidden] { display: none !important; }
      header, #menu { display: none; }
      /* a phone: the nav folds behind a menu button in a top bar and opens over the pane (ZvC's NavMenu) */
      @media (max-width: 640.98px) {
        body { flex-direction: column; }
        header { display: flex; align-items: center; flex: 0 0 48px; padding: 0 64px 0 12px; background: #15101f; border-bottom: 1px solid #2a2140; }
        header b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
        #menu { display: block; appearance: none; margin: 0; position: fixed; top: 7px; right: 10px; z-index: 6; width: 44px; height: 34px; cursor: pointer; border: 1px solid #3a2f58; border-radius: 4px;
          background: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23cfc4e6' stroke-linecap='round' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") no-repeat center/22px #1f1830; }
        #menu:checked { background-color: #4a3a7c; border-color: #ab80ff; }
        nav { display: none; position: fixed; top: 48px; left: 0; right: 0; bottom: 0; z-index: 5; border-right: 0; }
        #menu:checked ~ nav { display: block; }
        nav a { padding: 11px 16px; font-size: 15px; }
        main { flex: 1; }
        #approvals { padding: 4px 10px 40px; }
        .ap-fig { flex-basis: 100%; }
        .ap-decide textarea { flex-basis: 100%; }
      }

      button, textarea { font: inherit; color: #cfc4e6; background: #1f1830; border: 1px solid #3a2f58; border-radius: 4px; }
      button { padding: 3px 11px; cursor: pointer; }
      button:disabled { opacity: .4; cursor: default; }
      button.on { background: #4a3a7c; color: #fff; border-color: #ab80ff; }
      .ap-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
      .ap-list { display: flex; flex-direction: column; gap: 14px; max-width: 1100px; }
      .ap-card { background: #15101f; border: 1px solid #2a2140; border-radius: 8px; padding: 10px 14px; }
      .ap-card.approved { border-color: #3a8f5c; } .ap-card.revise { border-color: #b08a2e; } .ap-card.rejected { border-color: #7a3a3a; }
      .ap-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .ap-title { flex: 1; font-weight: 600; font-size: 15px; cursor: pointer; }
      .ap-cat, .ap-badge { font-size: 10px; padding: 1px 8px; border-radius: 20px; background: #2a2140; letter-spacing: .04em; }
      .ap-badge { font-weight: 700; color: #fff; }
      .ap-badge.approved { background: #2f7d4f; } .ap-badge.revise { background: #8a6a1e; } .ap-badge.rejected { background: #8a3a3a; }
      .ap-meta { font-size: 11px; color: #8d80ad; }
      .ap-notes { white-space: pre-wrap; line-height: 1.45; margin: 8px 0; background: #0d0a14; border-radius: 6px; padding: 8px 10px; border: 1px solid #231b36; }
      .ap-media { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
      .ap-pair { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; }
      .ap-fig { margin: 0; flex: 1 1 420px; max-width: 100%; }
      .ap-fig img, .ap-fig video { width: 100%; height: auto; border-radius: 6px; border: 1px solid #231b36; background: #000; display: block; }
      .ap-fig img { cursor: zoom-in; }
      .ap-fig figcaption, .ap-missing { font-size: 11px; color: #8d80ad; margin-top: 2px; }
      .ap-links { display: flex; gap: 12px; flex-wrap: wrap; margin: 6px 0; }
      .ap-links a { color: #ab80ff; }
      .ap-decide { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; margin-top: 8px; }
      .ap-decide textarea { flex: 1 1 320px; min-height: 52px; padding: 4px 6px; }
      .ap-hist { margin-top: 8px; border-top: 1px solid #231b36; padding-top: 6px; font-size: 12px; }
      .ap-hist .row-h { display: flex; gap: 8px; align-items: baseline; margin: 2px 0; }
      .ap-hist .note { white-space: pre-wrap; }
      .ap-lightbox { position: fixed; inset: 0; background: rgba(5, 4, 10, .94); z-index: 10; display: flex; align-items: center; justify-content: center; }
      .ap-lightbox img { max-width: 96vw; max-height: 94vh; object-fit: contain; }
      .ap-lightbox .cap { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #aaa0c4; }
    </style>
  </head>
  <body>
    <header><b id="here">Hungry God Inc workshop</b></header>
    <input type="checkbox" id="menu" title="Pages" />
    <nav id="nav"></nav>
    <main>
      <iframe id="pane" title="workshop page"></iframe>
      <div id="approvals" hidden></div>
    </main>
    <script type="module" src="/dev/src/workshop.ts"></script>
  </body>
</html>
